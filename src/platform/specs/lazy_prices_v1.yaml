spec_version: 1
strategy_id: lazy_prices_v1
display_name: Lazy Prices (Cohen-Malloy-Nguyen 2020)

# R8(a): derived_from is a required field on every strategy spec. null is
# the explicit declaration that this strategy was NOT derived from any
# forensic audit, bootcamp backtest, shadow-trading cohort, or similar
# internal analysis — it is literature-derived from the Cohen, Malloy,
# Nguyen (2020 Journal of Finance) paper.
derived_from: null

description: >
  Enter long positions on stocks with low cosine similarity between current
  and prior-year 10-K/10-Q Risk Factors and MD&A sections. Fundamental
  drift effect with 14-28 day holds.

citation: Cohen, Malloy, Nguyen (JF 2020). ~188 bps/month alpha (t=2.76).

universe:
  tickers: sp100

entry:
  kind: event_driven
  event_table: edgar_filings
  event_filter:
    form_type: [10-K, 10-Q]
    filing_date_within_days: 5
  signal:
    - metric: cosine_similarity
      target: item_1a
      reference: prior_year_same_form
      operator: less_than
      threshold: 0.75
    - metric: cosine_similarity
      target: item_7
      reference: prior_year_same_form
      operator: less_than
      threshold: 0.75
  combinator: any

exit:
  kind: mechanical
  timeout_days: 21
  stop:
    method: atr_based
    atr_period: 14
    multiplier: 3.0
    floor_pct: 0.05
    cap_pct: 0.12
  target:
    method: atr_based
    atr_period: 14
    multiplier: 6.0
    floor_pct: 0.10
    cap_pct: 0.25

position_sizing:
  method: fixed_pct_equity
  pct: 0.15
  max_concurrent: 5

attribution:
  benchmark: SPY_matched_window
  metrics: [raw_sharpe, excess_sharpe, win_rate, profit_factor, max_drawdown]

llm_enhancement:
  enabled: false
  model: halcyon-v1.0.0
  role: structured_extraction
  prompt_template: lazy_prices_research_prompt
  validation: verbatim_quote_grounded
