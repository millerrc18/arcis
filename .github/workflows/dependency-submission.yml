name: Dependency Submission

# Replaces GitHub's auto-generated "Automatic Dependency Submission (Python)"
# workflow, which was failing on every PR push (and most main pushes) because
# it scans ALL requirements*.txt files in the repo root — including
# requirements-training.txt, which contains the volatile dep:
#
#   unsloth[cu128-torch260] @ git+https://github.com/unslothai/unsloth.git
#
# Git URLs with extras + a master-tracking ref are brittle for the upstream
# dep-submission parser. Every cutover-hotfix PR (1163-1166) showed
# submit-pypi RED for this reason; PR 1162 only went green after later
# pushes happened to land while the parser tolerated the URL.
#
# This replacement:
#   - Runs ONLY on push:main (not per-PR — was ~3min/PR of pure waste
#     while RED — see v0.36.55 release notes)
#   - Scans ONLY requirements.txt (base deps; sidesteps unsloth git+URL)
#   - Uses pypa/gh-action-pip-audit (official PyPA), which audits base deps
#     for known vulnerabilities on every main push; findings surface via
#     Insights → Security + Dependabot alerts
#
# Per v0.36.55 CI hygiene hotfix (#101).
#
# NOTE: GitHub's auto-generated "Automatic Dependency Submission (Python)"
# may continue running alongside this workflow until the operator
# explicitly disables it via the repo settings API:
#
#   gh api -X PATCH /repos/:owner/:repo \
#     -F 'security_and_analysis[dependency_graph_autosubmit][status]=disabled'
#
# Run-once command — documented in PR #101 description.

"on":
  push:
    branches: [main]

permissions:
  # Required by pypa/gh-action-pip-audit to submit findings to the
  # GitHub Dependency Submission API. No write access to repo contents,
  # workflows, or settings.
  contents: write

jobs:
  submit-pypi:
    runs-on: ubuntu-latest
    # Mirrors the dynamic auto-submission's job name so the merged-main
    # check ledger remains continuous — anyone querying historical
    # `submit-pypi` status (PR detail panes, dashboards) sees an
    # unbroken named-check timeline.
    name: submit-pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit base requirements.txt
        # `inputs: requirements.txt` is the key scoping mechanism — the
        # auto-submission scans all requirements*.txt files unconditionally;
        # here we explicitly pin to the base file so requirements-cloud.txt
        # (cloud-deploy-only) and requirements-training.txt (volatile
        # unsloth git+URL) are both out of scope. pg-tests + lifecycle-smoke
        # also install only requirements.txt in CI, so this matches the
        # actual prod-CI install surface.
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          # Don't render a noisy job-summary block (just log + dep-graph
          # submission). The Insights → Security tab is the real surface.
          summary: false
        # Don't block main on vuln findings — they're info, not gate.
        # If a real high-severity vuln appears in base deps, operator
        # sees it via the Insights → Security tab + Dependabot alerts.
        # The job's purpose is dep-graph hygiene + audit log on main
        # pushes — failing the workflow on every new CVE would be noise.
        continue-on-error: true
