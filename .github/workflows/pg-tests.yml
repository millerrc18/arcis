name: PG Tests

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # schedule + workflow_dispatch added for the nightly lifecycle-full-gate job
  # below. The existing pg-tests job is unaffected — it still runs on every
  # pull_request/push as before; these triggers only ADD nightly/manual runs.
  schedule:
    # 07:00 UTC nightly (~02:00 ET) — after the overnight trading window.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: halcyon
          POSTGRES_PASSWORD: halcyon
          POSTGRES_DB: halcyon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Second PG on host-port 5434 (test:test) — PR-E2 T41a robust fix. The
      # lifecycle bootstrap scrubs TEST_DATABASE_URL -> :5434 at IMPORT (collection),
      # which 24 module-level `TEST_PG_URL = os.environ.get("TEST_DATABASE_URL")`
      # readers freeze, and SIM_DSN-hardcoded tools/lifecycle tests target :5434
      # directly. Both services are bootstrapped (below) so every :5434- and
      # :5432-targeting connection succeeds regardless of collection order.
      postgres5434:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: halcyon
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test -d halcyon"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://halcyon:halcyon@localhost:5432/halcyon
      # ARCIS_DB_PATH is required by src/config/__init__.py at module-import time
      # (raises if neither ARCIS_DB_PATH nor DATABASE_URL is set — see CLAUDE.md #642).
      # Production code path remains SQLite (this is Phase 0 — connect_db precedence
      # NOT yet flipped to DATABASE_URL); only the parametrized_conn fixture opts
      # into PG via TEST_DATABASE_URL. Use an in-CI ephemeral path so tests that
      # touch the production-shape SQLite path get a writable file (the watchdog.txt
      # tests and a few others need a real path, not :memory:).
      ARCIS_DB_PATH: /tmp/arcis_ci.sqlite3
      # PYTHONUTF8=1 prevents TRL/jinja codec issues on non-UTF-8 systems
      # (discovered 2026-05-10 during RTX 3090 training-readiness verify).
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # setup-python's built-in cache:'pip' caches the pip DOWNLOAD cache
          # (~/.cache/pip). Complementary to the actions/cache@v4 step below
          # which caches the INSTALLED packages (env.pythonLocation) — the
          # two together give cold-miss ~60-90s + warm-hit ~5s.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache installed packages
        # env.pythonLocation is set by actions/setup-python to the install
        # root. Caching it captures site-packages + .pth files +
        # entry-point scripts. Key includes Python minor version so a future
        # 3.13 bump won't poison this cache. hashFiles uses ONLY
        # requirements.txt — requirements-cloud.txt (server-only) and
        # training/requirements.txt (training-only + volatile unsloth git+URL,
        # relocated from repo-root requirements-training.txt in v0.36.55/#101)
        # are not installed in this CI job, so hashing them would force
        # unnecessary cold-cache rebuilds.
        id: pkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-python3.12-pkgs-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        # On cache HIT, pip sees everything satisfied and exits in ~3-5s.
        # On MISS, full install runs (~60-90s) and the cache is written
        # on post-step. The install step also acts as a sanity check — if
        # the cache is somehow stale or corrupted, pip idempotently
        # installs whatever's missing.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-asyncio

      - name: Bootstrap PG test schema
        run: python scripts/bootstrap_pg_test_schema.py

      - name: Bootstrap PG test schema on 5434 sim PG
        # Bootstrap the registry schema on the 5434 service (PR-E2 T41a robust
        # fix) so the 24 module-level TEST_DATABASE_URL readers that froze the
        # lifecycle :5434 scrub value, and the SIM_DSN-hardcoded tools/lifecycle
        # tests, connect to real tables instead of "connection refused 5434".
        run: TEST_DATABASE_URL=postgresql://test:test@127.0.0.1:5434/halcyon python scripts/bootstrap_pg_test_schema.py

      - name: Bootstrap SQLite production-path schema
        # Production code path (Phase 0 — connect_db precedence not yet flipped)
        # uses ARCIS_DB_PATH SQLite. Tests that hit production-shape API
        # endpoints (test_projections, test_route_parity, test_status, etc.)
        # call connect_db() which routes to /tmp/arcis_ci.sqlite3 and fails
        # 500-style if the registry tables aren't present. validate-schema
        # --fix creates all 72 tables from src/schema/registry.py.
        run: python -m src.main validate-schema --fix

      - name: Create test/test PG role
        # Three test fixtures (tests/api/test_status.py:18, tests/test_cloud_app.py:15,
        # tests/test_shadow_desk_filter.py:25) hardcode DATABASE_URL=postgresql://test:test@localhost/halcyon
        # via monkeypatch.setenv. Production code reading DATABASE_URL routes to PG,
        # which fails auth against the halcyon-only sidecar. Create the test role
        # so those connections succeed (the tests then hit their own assertions
        # against the test-shaped DB state).
        # TODO Sprint 5 §J: migrate those 3 fixtures to use the halcyon role
        # (or a per-test temp role) so this workflow step can be removed.
        run: |
          export PGPASSWORD=halcyon
          psql -h localhost -U halcyon -d halcyon -c "CREATE USER test WITH PASSWORD 'test' SUPERUSER;" || echo "test role already exists"

      - name: Run test suite against Postgres
        run: python -m pytest tests/ -q --timeout=60 | tee pytest-output.txt

      - name: Enforce test-count floor
        run: |
          ACTUAL=$(grep -oE '[0-9]+ passed' pytest-output.txt | head -1 | grep -oE '[0-9]+')
          # Floor accounts for chronic-failure class (worktree env-drift, hardcoded
          # test:test fixtures, env-pollution affecting test_feature_matrix_distinguishes_free_and_premium,
          # scripts/archive_bootcamp_2026_04_24.py registry-count drift, etc.).
          # Floor lineage:
          #   4995 (initial CI run with all Sprint 5 Phase 1+2 fixes)
          #   5050 (post-Phase-2.5: +55 tests from KNOWN_OFFENDERS date-function cleanup)
          #   5100 (Sprint 5 close 2026-05-13: +50 tests across Wave C7a (12) +
          #         Wave C7b (27) + T13 _html_escape siblings (5) + T14 alert silence
          #         (8) + T16 CompatRow indexing (6); CLAUDE.md SQLite-only floor
          #         5400, this floor 5100 because PG-aware sweep loses ~300 to
          #         the chronic-failure class on CI hosted runners)
          #   5188 (#94 dual-GPU re-cutover 2026-05-22: net −49+137=+88. Deleted 49
          #         vram_manager tests (T14, 5 files); added 137 new behavioral tests
          #         across the watchdog/training-control/startup-guard/liveness/
          #         gpu-pin/handler-registration suites. Same +88 delta applied to
          #         the CLAUDE.md SQLite-only floor (5300->5388).)
          #   5267 (#111 arcis:periodic-discipline 2026-05-26: +28 test functions / +79
          #         pytest-collected cases (parametrize expansion) across tests/skills/
          #         (54 collected: 17+54 boundary) and tests/tools/test_workflow_parity_
          #         scanner.py (5). CLAUDE.md SQLite-only floor 5388->5467.)
          # Bump when full-sweep grows past the previous floor.
          EXPECTED=5267
          echo "Tests passed: $ACTUAL (floor: $EXPECTED)"
          if [ -z "$ACTUAL" ]; then
            echo "Could not extract test count from pytest output" >&2
            exit 1
          fi
          if [ "$ACTUAL" -lt "$EXPECTED" ]; then
            echo "Test count $ACTUAL below floor $EXPECTED — failing" >&2
            exit 1
          fi

  # Nightly (and manual) AUTHORITATIVE lifecycle full-gate. Gated to schedule +
  # workflow_dispatch ONLY — NOT every PR (cost). Reuses the 5434 ephemeral
  # Docker-PG pattern (host 5434 -> container 5432, user/pass test/test, db
  # halcyon) that run_full_gate() and docker-compose.test.yml expect. Runs
  # run_full_gate() (the only integrity-AUTHORITATIVE tier) and uploads the
  # rendered verdict as an artifact. STABLE means all 9 data-integrity
  # invariants passed against the constraint-enforcing PG schema; the smoke
  # tier (per-PR, SQLite) is wiring-only and explicitly non-authoritative.
  lifecycle-full-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: halcyon
        ports:
          # host 5434 -> container 5432: the safe DSN run_full_gate() pins
          # (postgresql://test:test@127.0.0.1:5434/halcyon).
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test -d halcyon"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache installed packages
        # Same env.pythonLocation cache pattern as the pg-tests job above
        # — shared key (no job-specific suffix) means the two jobs can
        # share the same cache entry when their requirements.txt hash
        # matches. cache: 'pip' above + this cache: warm-hit ~5s install.
        id: pkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-python3.12-pkgs-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-asyncio

      - name: Run authoritative lifecycle full gate
        # run_full_gate() bootstraps the registry schema on the 5434 PG and
        # writes the AUTHORITATIVE verdict to lifecycle-verdict.txt. The
        # bootstrap module scrubs the env to the safe 5434 DSN first, so this
        # can never reach production even if DATABASE_URL were tampered.
        run: |
          python -c "from src.simulation.lifecycle import run_full_gate; r = run_full_gate(); open('lifecycle-verdict.txt', 'w', encoding='utf-8').write('tier=' + r.tier + ' verdict=' + str(r.verdict) + '\n' + r.report); print('tier=', r.tier, 'verdict=', r.verdict); print(r.report)"

      - name: Upload verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-full-gate-verdict
          path: lifecycle-verdict.txt
