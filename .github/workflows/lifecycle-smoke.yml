name: Lifecycle Smoke

# Per-PR (and per-push) fast wiring/regression tier for the lifecycle simulator.
# Runs on a runner with the ephemeral 5434 PG service block (mirrors the
# postgres-test service in pg-tests.yml's lifecycle-full-gate). The smoke
# scenario drives run_smoke() using the T9 organic open->exit->reconcile
# lifecycle, which writes through the real prod scan path
# (universe_scanner -> log_recommendation -> executor.open_shadow_trade)
# → PG under the safe DSN (postgresql://test:test@127.0.0.1:5434/halcyon).
#
# Integrity verdict is NON-authoritative for the SMOKE tier (fewer sim-days,
# lighter scenario, no fault matrix) — the authoritative integrity gate is the
# nightly full-gate job in pg-tests.yml. This job exists for wiring +
# regression coverage on every PR.
#
# WHY a postgres-test service block here (was absent in v0.36.50): smoke.py's
# T9 organic runner writes through connect_db(None) → PG under bootstrap's env
# (DATABASE_URL=5434 + ARCIS_PG_CUTOVER_ENABLED=1). An all-SQLite smoke cannot
# drive the organic runner without redirecting every prod write, which would
# defeat the wiring-coverage purpose. The 5434 ephemeral PG is the cheapest
# correct way to exercise the real prod scan path in CI per PR.
"on":
  push:
    # NO paths: filter on push:main — every main push runs the smoke as a
    # safety net for upstream-refactor breakage that the strict-sim path
    # filter on pull_request would miss (shadow_trading / schema / scheduler
    # / risk / cost_model / oracle are all upstream of src/simulation/ at
    # import time; a refactor to any of them that breaks the lifecycle
    # would otherwise only be caught by the nightly lifecycle-full-gate —
    # a 24h reliability window during which #95 wipe gate trust degrades).
    branches: [main]
  pull_request:
    branches: [main]
    # PR-only path filter: most PRs don't touch the simulation pipeline.
    # Operator's strict-rigor policy (catch upstream-refactor breakage at
    # merge time, NOT 24h later via nightly): the PR-trigger filter is
    # aggressive for minute savings, the push:main trigger above is the
    # unfiltered safety net.
    paths:
      - 'src/simulation/**'
      - 'tests/simulation/**'
      - '.github/workflows/lifecycle-smoke.yml'

jobs:
  lifecycle-smoke:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: halcyon
        ports:
          # host 5434 -> container 5432: the safe DSN run_smoke() pins
          # (postgresql://test:test@127.0.0.1:5434/halcyon).
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test -d halcyon"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      # ARCIS_DB_PATH is required by src/config/__init__.py at module-import
      # time (raises if neither ARCIS_DB_PATH nor DATABASE_URL is set — see
      # CLAUDE.md #642). The lifecycle/trainer_stub tests import
      # training_stop which uses DB_PATH at module level — without this env
      # var, collection raises TypeError: expected str, bytes or os.PathLike.
      ARCIS_DB_PATH: /tmp/arcis_ci.sqlite3
      # ALPACA_API_KEY/SECRET stubs let place_bracket_order's precondition
      # check pass so the patched alpaca_adapter._get_trading_client (wiring
      # patch #1) is actually CALLED. Without these, executor raises
      # PaperTradingError before reaching the fake trading client, causing
      # ProvenanceError("submit_order never invoked"). The fake doesn't
      # validate these — any non-empty string works.
      ALPACA_API_KEY: sim-noop
      ALPACA_API_SECRET: sim-noop
      # PYTHONUTF8=1 prevents TRL/jinja codec issues on non-UTF-8 systems
      # (discovered 2026-05-10 during RTX 3090 training-readiness verify).
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # setup-python's built-in cache:'pip' caches the pip DOWNLOAD cache
          # (~/.cache/pip). Complementary to the actions/cache@v4 step below
          # which caches the INSTALLED packages (env.pythonLocation) — the
          # two together give cold-miss ~60-90s + warm-hit ~5s.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache installed packages
        # env.pythonLocation is set by actions/setup-python to the install
        # root (e.g. /opt/hostedtoolcache/Python/3.12.x/x64). Caching it
        # captures site-packages + .pth files + entry-point scripts —
        # everything pip writes during install. Key components:
        #   runner.os   — Linux binaries can't restore to a future Windows
        #                 self-hosted runner; segregate by OS
        #   python3.12  — pin to the Python minor; a future 3.13 bump won't
        #                 poison this cache (.so files are cpython-version
        #                 specific)
        #   hashFiles   — ONLY requirements.txt. NOT requirements-cloud.txt
        #                 (server-only deps, not installed in these CI jobs)
        #                 and NOT training/requirements.txt (relocated from
        #                 repo-root requirements-training.txt in v0.36.55/#101
        #                 — the unsloth git+URL is volatile + breaks the
        #                 GitHub auto dependency-submission parser; relocating
        #                 OUT of repo-root scan range was the root-cause fix).
        #                 Also not installed here. Per-PR diff analysis showed
        #                 hashing the training file would force unnecessary
        #                 cold-cache rebuilds.
        id: pkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-python3.12-pkgs-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        # requirements.txt pins freezegun>=1.5,<2.0 (the simulator clock source);
        # installing it here ensures the smoke run has its determinism dependency.
        # When the package cache above HITS (env.pythonLocation restored), pip
        # sees everything satisfied and exits in ~3-5s. On MISS, the full
        # install runs (~60-90s) and the cache is written by actions/cache on
        # post-step. The install step doubles as a cache-validity sanity check
        # — if the cache is somehow stale or corrupted, pip idempotently
        # installs whatever's missing.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout psycopg2-binary

      - name: Bootstrap 5434 sim PG schema
        # T9 organic runner reads/writes through PG. Without the schema, every
        # test that calls run_smoke / run_full_gate / ScenarioRunner errors with
        # UndefinedTable. Bootstrap creates the full registry on the
        # postgres-test container before any test runs.
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -p 5434 -U test -d halcyon -c "SELECT 1;" \
            && python -c "from src.simulation.lifecycle.bootstrap import SIM_DATABASE_URL; from src.schema.postgres import create_all_tables; create_all_tables(SIM_DATABASE_URL); print('schema bootstrapped')"

      - name: Bootstrap SQLite production-path schema
        # Mirrors pg-tests step 7. Tests that hit production-shape API surfaces
        # call connect_db() which routes to ARCIS_DB_PATH SQLite; validate-schema
        # --fix creates the registry tables.
        run: python -m src.main validate-schema --fix

      - name: Run lifecycle smoke (entrypoints + core lifecycle suite)
        # The entrypoints test invokes run_smoke() end-to-end on the 5434 PG;
        # the core lifecycle suite is the regression net around it. T9 organic
        # runner writes via real prod scan path, so PG is required.
        #
        # --timeout=480: #113 tightened from the original 600s ceiling.
        #
        # BOTTLENECK (identified in #113): run_smoke() drives the full prod
        # scan path (universe_scanner.run_universe_scan -> WatchLoop._run_scan)
        # with FakeLLM / FakeMarketData fakes — no real I/O, but real compute.
        # Each call takes ~50-100s on hosted runners. Worst-case single test is
        # test_no_conn_leak_smoke_accumulator (3 run_smoke() iterations by
        # default, SIM_LEAK_LOOP_ITERATIONS=3) at ~150-300s.
        #
        # WHY 300s NOT ACHIEVED IN ONE PASS: no time.sleep calls exist in these
        # tests (_noop_sleep already installed for WatchLoop). The bottleneck is
        # scan computation through run_universe_scan, which is prod code and
        # off-limits. Reducing coverage to hit 300s is forbidden by spec.
        # FOLLOW-UP: see GitHub issue filed as #113-followup — session-scoped
        # run_smoke() fixture caching could reduce test_entrypoints + test_determinism
        # from 9 independent run_smoke() calls to 1, saving ~400-700s total.
        #
        # -k "not full_gate": the 4 test_run_full_gate_* tests are the
        # AUTHORITATIVE nightly tier (multi-day, all faults, all invariants).
        # They run in .github/workflows/pg-tests.yml's lifecycle-full-gate
        # job (schedule-only, NOT per-PR). Their pytest.mark.skipif checks
        # _pg_5434_up() — that returns True here because we provision the
        # service block, but the tests are designed for the heavyweight
        # nightly schedule, not the per-PR fast tier. Filter them out so
        # per-PR runs stay fast.
        run: python -m pytest tests/simulation/lifecycle/ -q --timeout=480 -k "not full_gate"

      - name: Smoke verdict (run_smoke direct invocation)
        # Direct call so the rendered, non-authoritative verdict is visible in
        # the CI log. The job's purpose is wiring/regression, not authority.
        run: python -c "from src.simulation.lifecycle import run_smoke; r = run_smoke(); print('tier=', r.tier, 'verdict=', r.verdict); print(r.report)"
