name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"  # Daily at noon UTC (8 AM ET)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Repo structure guardrails
        run: python -m pytest tests/test_repo_structure.py -v --tb=short

      - name: Full test suite
        run: python -m pytest tests/ -x -q --timeout=60

      - name: Test count check
        run: |
          COUNT=$(find tests -name "test_*.py" -exec grep -c "def test_" {} + | awk -F: '{s+=$2}END{print s}')
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 1339 ]; then
            echo "::error::Test count dropped! Expected ≥1339, got $COUNT"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
