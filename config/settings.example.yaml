# ═══════════════════════════════════════════════════════════════════════════
# Arcis — Application Configuration Reference
# ═══════════════════════════════════════════════════════════════════════════
#
# HOW TO USE:
#   1. Copy this file to config/settings.yaml
#   2. Edit values for your environment
#   3. Commit settings.yaml to git (secrets are in .env, not here)
#
# SECRETS GO IN .env (not this file):
#   ALPACA_API_KEY, ALPACA_API_SECRET      Paper trading credentials
#   ALPACA_LIVE_API_KEY, ALPACA_LIVE_SECRET_KEY   Live trading
#   ANTHROPIC_API_KEY                      Claude API (council + scoring)
#   FINNHUB_API_KEY                        Market data enrichment
#   FRED_API_KEY                           Macro economic data
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   Push notifications
#   EMAIL_PASSWORD                         SMTP for digest emails
#   DATABASE_URL                           Render Postgres connection
#
# SECTION INDEX:
#   app .................. Environment and timezone
#   email ................ SMTP digest email configuration
#   alpaca ............... Broker API connection (paper account)
#   risk ................. Capital, position sizing, equity scaling, leverage, injections
#   shadow_trading ....... Paper trading on/off + limits
#   live_trading ......... Real-money dual execution (paper + live)
#   automation ........... Scan cadence and market hours
#   llm .................. Local Ollama model configuration
#   api .................. Claude API model selection for tasks
#   training ............. Training pipeline thresholds
#   data_enrichment ...... Finnhub / FRED enrichment settings
#   risk_governor ........ Circuit breakers and hard limits
#   event_risk ........... Earnings and event-calendar risk scoring
#   regime_adaptive ...... Dynamic thresholds by market regime
#   bootcamp ............. Phase 1 high-volume data collection mode
#   logging .............. Log level and output file
#   telegram ............. Real-time push notification config
#   render ............... Cloud dashboard sync settings
#   council .............. AI Council (5-agent deliberation)
#   execution ............ Order type and timeout
#
# ═══════════════════════════════════════════════════════════════════════════


# ─── APP ────────────────────────────────────────────────────────────────
# Core application settings.
# ────────────────────────────────────────────────────────────────────────

app:
  environment: local            # "local" — runs on your machine with Ollama
                                # "cloud" — Render deployment (no LLM access)
  timezone: America/New_York    # All scheduled events use this timezone.
                                # Must be a valid IANA timezone string.


# ─── EMAIL ──────────────────────────────────────────────────────────────
# SMTP configuration for digest emails (pre-market, midday, EOD, evening).
# For Gmail: use smtp.gmail.com / port 587 / an App Password (NOT your
# regular password — generate one at myaccount.google.com/apppasswords).
# Password should be in .env as EMAIL_PASSWORD, not here.
# ────────────────────────────────────────────────────────────────────────

email:
  smtp_server: smtp.gmail.com
  smtp_port: 587
  use_tls: true
  username: your-assistant-email@gmail.com   # The sending email address
  password: your-app-password-here           # MOVE THIS TO .env → EMAIL_PASSWORD
  from_address: your-assistant-email@gmail.com
  to_address: your.work@email.com            # Primary recipient
  cc_addresses:                              # Optional additional recipients
    - your.personal@email.com
  digest_times:                              # When to send each digest (ET)
    premarket: "07:30"                       #   Portfolio status, overnight events
    midday: "12:00"                          #   Morning trades, P&L, risk alerts
    eod: "16:15"                             #   Full day recap, cumulative stats
    evening: "20:00"                         #   Training data, model quality, costs


# ─── ALPACA ─────────────────────────────────────────────────────────────
# Broker API connection for paper trading.
# ⚠️  Keys should be in .env as ALPACA_API_KEY and ALPACA_API_SECRET.
# The base_url determines paper vs live — DO NOT change this to the
# live URL unless you know what you're doing.
# ────────────────────────────────────────────────────────────────────────

alpaca:
  api_key: YOUR_PAPER_API_KEY                # → .env: ALPACA_API_KEY
  api_secret: YOUR_PAPER_API_SECRET          # → .env: ALPACA_API_SECRET
  base_url: https://paper-api.alpaca.markets # Paper trading endpoint.
                                             # Live would be https://api.alpaca.markets
                                             # but the adapter has a safety check.


# ─── RISK ───────────────────────────────────────────────────────────────
# Base capital and per-trade risk parameters. These feed into position
# sizing: shares = max_risk_dollars / stop_distance.
# ────────────────────────────────────────────────────────────────────────

risk:
  starting_capital: 100000      # Dollar amount matching your paper/live account.
                                # Used to calculate position sizes and P&L percentages.
  planned_risk_pct_min: 0.005   # Minimum risk per trade (0.5% of capital = $500).
                                # Applied when conviction is low.
  planned_risk_pct_max: 0.01    # Maximum risk per trade (1.0% of capital = $1,000).
                                # Applied when conviction is high.
                                # NOTE: overridden by equity_scaling tiers when enabled.
  max_open_positions: 10        # Hard cap on simultaneous open positions.
                                # Overridden by bootcamp.max_positions when bootcamp is on.

  # ─── ACCOUNT-SIZE RISK SCALING (Strategy Decision #26) ──────────
  # Automatically reduces risk per trade as equity grows.
  # Governor checks current equity (starting_capital + realized P&L)
  # and applies the matching tier. First match wins (sorted ascending).
  # If disabled or empty, planned_risk_pct_max is used as-is.
  #
  # This sets the BASE risk. Thorp drawdown adjustment, Traffic Light,
  # and event risk multipliers are applied ON TOP of the tier value.
  # ─────────────────────────────────────────────────────────────────
  risk_scaling:
    enabled: false                  # true = use tiered risk based on equity
    tiers:
      - equity_below: 100000
        risk_pct_max: 0.02          # 2.0% — prove the edge ($5K-$100K)
      - equity_below: 500000
        risk_pct_max: 0.015         # 1.5% — scaling phase ($100K-$500K)
      - equity_below: 1000000
        risk_pct_max: 0.0125        # 1.25% — real money ($500K-$1M)
      - equity_below: 999999999
        risk_pct_max: 0.01          # 1.0% — institutional ($1M+)
    notify_on_transition: true      # Telegram alert when tier changes

  # ── Equity-Based Risk Scaling (Strategy Decision #26) ──────────────
  # As the account grows, risk per trade decreases automatically.
  # The governor checks current equity against these tiers and applies
  # the matching planned_risk_pct_max. Tiers are evaluated top-to-bottom;
  # the first tier where equity >= threshold wins.
  #
  # Source: Scaling Levers deep research (Kelly analysis, Monte Carlo).
  # At 2% risk with 55% WR / 1.5 PF, ruin probability is <0.001%.
  # Reducing risk at scale preserves the compounding base — a 30% DD
  # at $500K ($150K) is psychologically devastating vs 30% at $5K ($1.5K).
  #
  # When disabled, the static planned_risk_pct_max above applies at all sizes.
  equity_scaling:
    enabled: false              # true = auto-adjust risk by equity tier.
                                # false = use static planned_risk_pct_max above.
    tiers:                      # Evaluated in order. First match wins.
      - equity_above: 1000000   # $1M+ → conservative institutional sizing
        risk_pct_max: 0.010     # 1.0% max risk per trade
        max_positions: 4        # Fewer, larger positions
        max_portfolio_heat: 0.04  # 4% total portfolio risk
      - equity_above: 500000    # $500K-$1M → begin scaling down
        risk_pct_max: 0.0125    # 1.25% max risk per trade
        max_positions: 4
        max_portfolio_heat: 0.05  # 5%
      - equity_above: 100000    # $100K-$500K → standard scaling
        risk_pct_max: 0.015     # 1.5% max risk per trade
        max_positions: 5
        max_portfolio_heat: 0.075  # 7.5%
      - equity_above: 0         # $0-$100K → Phase 1 aggressive data collection
        risk_pct_max: 0.02      # 2.0% max risk per trade
        max_positions: 5
        max_portfolio_heat: 0.10  # 10%

  # ── Leverage Awareness ─────────────────────────────────────────────
  # The system does not control margin (that is broker-side). This tells
  # the governor what leverage is active so position sizing accounts for
  # amplified exposure. At 1.5x, a $100K account has $150K buying power
  # but drawdowns are also 1.5x — the governor must size to the LEVERAGED
  # drawdown, not the equity-only drawdown.
  #
  # Activation sequence (Strategy Decision #26):
  #   $0-$25K:    1.0 (no leverage — prove edge first)
  #   $25K-$100K: 1.25-1.5 (Reg T margin after 100+ trades)
  #   $100K+:     up to 1.5 (IB portfolio margin, lower rates)
  #   $500K+:     1.0-1.25 (reduce as absolute dollar risk grows)
  leverage:
    enabled: false              # true = account for margin in sizing.
    multiplier: 1.0             # 1.0 = no leverage. 1.5 = 50% margin.
                                # Affects: buying power calculation, drawdown projection,
                                # margin cost estimation. Does NOT change broker settings.
    margin_rate_annual: 0.0625  # Annual interest rate on borrowed capital.
                                # Alpaca standard: 6.25%. IB Pro: ~5.0%.
                                # Used for cost estimation in CTO report, not execution.

  # ── Capital Injection Tracking ─────────────────────────────────────
  # Below $80K, salary injection dominates compounding as a growth driver.
  # $1K/month → 4.5x terminal wealth improvement over 5 years.
  # This section tracks planned vs actual injections for dashboard reporting.
  capital_injection:
    enabled: false              # true = track monthly injections on dashboard.
    monthly_target: 0           # USD/month planned injection from W-2 income.
                                # Set to your actual savings rate (e.g., 1000).
    zero_withdrawal_until: 500000  # Do not withdraw capital below this equity level.
                                   # Each $1 withdrawn early costs ~$1.88 in future value.


# ─── SHADOW TRADING (Paper) ────────────────────────────────────────────
# Controls the paper trading system. When enabled, qualifying stocks
# automatically get bracket orders placed on your Alpaca paper account.
# ────────────────────────────────────────────────────────────────────────

shadow_trading:
  enabled: false                # true = auto-trade qualifying stocks on paper account.
                                # false = scan and score only, no orders placed.
  max_positions: 10             # Max simultaneous paper positions (see also bootcamp).
  default_order_type: market    # "market" — immediate fill at current price.
                                # "limit" — see execution section below.
  timeout_days: 15              # Auto-close any position held longer than this.
                                # NOTE: overridden per-strategy when strategies.pullback.timeout_days
                                # or strategies.mean_reversion.holding_period is set.
                                # This is the global fallback for uncategorized trades.


# ─── LIVE TRADING (Dual Execution) ─────────────────────────────────────
# When enabled, qualifying setups execute on BOTH paper AND live accounts
# simultaneously. Paper trades continue for the training flywheel.
# Live trades use real capital with tighter risk limits.
#
# SAFETY FEATURES:
#   - Requires LLM commentary (no template fallback allowed)
#   - Skips the first scan of the day (waits for market to settle)
#   - Halts automatically if equity drops below 50% of starting capital
#   - LLM conviction must be non-null for any live trade
#
# ⚠️  Live API keys should be in .env as ALPACA_LIVE_API_KEY and
#     ALPACA_LIVE_SECRET_KEY — not in this file.
# ────────────────────────────────────────────────────────────────────────

# ─── BROKER FEATURE FLAGS ───────────────────────────────────────────────
# Cross-cutting flags that gate broker-specific code paths globally.
# Distinct from live_trading.broker (which selects which broker to use).
trading:
  ib_enabled: false                        # SD#41 — IB dormant through Phase 1.
                                           # When false: broker_factory falls back
                                           # to Alpaca, executor skips IB shadow log,
                                           # reconcile leaves IB positions for brackets.
                                           # See docs/research/SD-41-defer-ib-integration.md

live_trading:
  enabled: false                           # true = real money. Be very sure.
  broker: "alpaca"                         # "alpaca" or "ib". IB requires Gateway running.
  starting_capital: 100                    # USD. Keep small while validating.
  max_open_positions: 5
  # Sticky graduation flag — once Stage 1 baseline is signed, set to true
  # to prevent the auditor's bootcamp_mode from auto-flipping back when
  # closed-trade counters get filtered (e.g. Wave 4 H5 excluding
  # reconciled_stale rows). When true, ordinary CRITICAL audit flags
  # always halt trading (production behavior); when false, they're
  # downgraded to alerts during bootcamp (<50 closed trades). Default
  # false — fresh installs go through bootcamp until manually graduated.
  # Categories in _NEVER_DOWNGRADE (risk_governor_breach,
  # emergency_halt_bypass) always halt regardless of this flag.
  post_bootcamp: false
  risk:
    planned_risk_pct_max: 0.02             # 2% max risk per live trade.
    stop_atr_multiplier: 2.0              # ATR multiplier for stop distance.
    target_atr_multiplier: 2.0             # Target at 2x ATR from entry.
    timeout_days: 7                        # Auto-close live trades after 7 days.
  min_score: null                          # Optional: minimum ranker score (0-100) for live.
  max_price: null                          # Optional: skip stocks above this price.
  # Interactive Brokers settings (only used when broker: "ib")
  ib:
    host: "127.0.0.1"
    port: 4002                             # 4002=paper, 4001=live. START WITH 4002.
    client_id: 1
    timeout: 10
    # IB Gateway must be running on this machine
    paper_routing: false                   # Route high-score paper trades to IB paper
    paper_routing_threshold: 80            # Score >= this goes to IB, below stays Alpaca
    shadow_mode: false                     # Log what IB would do without executing
  # Alpaca live settings (only used when broker: "alpaca")
  api_key: "your-live-alpaca-api-key"      # → .env: ALPACA_LIVE_API_KEY
  secret_key: "your-live-alpaca-secret-key"  # → .env: ALPACA_LIVE_SECRET_KEY


# ─── AUTOMATION ─────────────────────────────────────────────────────────
# Controls when the watch loop runs scans, sends watchlists, and recaps.
# All times are Eastern Time (ET).
# ────────────────────────────────────────────────────────────────────────

automation:
  morning_watchlist_hour_et: 8             # Send morning watchlist at 8:00 AM ET.
  eod_recap_hour_et: 16                    # Send EOD recap at 4:00 PM ET.
  scan_interval_minutes: 30                # Minutes between market scans (9:30-4:00 ET).
                                           # 15 = more responsive, higher API usage.
                                           # 30 = default, good balance.
                                           # 60 = minimal, for slow strategies.
  market_open_hour_et: 9                   # NYSE opens at 9:30 ET.
  market_open_minute_et: 30
  market_close_hour_et: 16                 # NYSE closes at 4:00 PM ET.


# ─── LLM (Local Ollama) ────────────────────────────────────────────────
# Local language model for trade commentary generation. Runs on GPU via
# Ollama. The model writes analysis + conviction scores for each trade
# packet. Currently a commentary engine; graduates to decision-maker
# in Phase 2 after conviction calibration.
# ────────────────────────────────────────────────────────────────────────

llm:
  enabled: true                            # false = skip LLM commentary, use template fallback.
  model: "qwen3:8b"                        # Ollama model tag. Must be pulled first:
                                           #   ollama pull qwen3:8b
                                           # Custom fine-tuned: "halcyonlatest" after training.
  base_url: "http://localhost:11434"        # Ollama API endpoint. Default port 11434.
  temperature: 0.7                         # 0.0 = deterministic, 1.0 = creative.
                                           # 0.7 = balanced for trade analysis.
  max_tokens: 1500                         # Max output tokens per LLM call.
                                           # Trade commentaries are typically 400-800 tokens.
  timeout_seconds: 180                     # Max wait for LLM response.
                                           # Qwen3 8B on RTX 3060: ~30-60s typical.
                                           # Increase to 300 if seeing timeouts under load.
  use_grammar_enforcement: false           # true = constrained XML output via llama-cpp-python.
                                           # Requires llama-cpp-python + GBNF grammar file.
                                           # Ollama cannot enforce output format natively.
  grammar_file: "config/trade_commentary.gbnf"  # GBNF grammar for constrained decoding.


# ─── API (Claude) ───────────────────────────────────────────────────────
# Claude API model selection for different tasks. Each task can use a
# different model tier based on quality requirements.
# Sonnet = fast + cheap (~$3/M input). Opus = highest quality (~$15/M input).
# ⚠️  API key in .env as ANTHROPIC_API_KEY.
# ────────────────────────────────────────────────────────────────────────

api:
  models:
    training_generation: "claude-sonnet-4-20250514"        # Generates training examples from closed trades.
    training_generation_anchor: "claude-opus-4-20250514"   # Generates anchor (highest quality) examples.
    quality_scoring: "claude-sonnet-4-20250514"            # Scores training example quality (1-5).
    council_automated: "claude-sonnet-4-20250514"          # Powers the 5-agent AI council sessions.
  anchor_count: 75             # Number of highest-quality "anchor" examples to maintain.
                               # These get oversampled during training (golden ratio 62/38).
  anchor_min_score: 4.5        # Minimum quality score to qualify as an anchor.


# ─── TRAINING ───────────────────────────────────────────────────────────
# Controls the automated training pipeline. The system collects training
# examples from closed trades, scores them for quality, and periodically
# fine-tunes the local LLM.
# ────────────────────────────────────────────────────────────────────────

training:
  enabled: true
  anthropic_api_key: "your-anthropic-api-key-here"  # → .env: ANTHROPIC_API_KEY
  claude_model: "claude-sonnet-4-20250514"           # Used by quality scoring + training gen.
  auto_train_threshold: 500    # Trigger fine-tune when this many NEW examples accumulate
                               # since the last training run. 500 is high enough that
                               # bulk backfill imports won't spuriously trigger retraining;
                               # genuine trade-flow accumulation is the intended signal.
  auto_train_time_days: 7      # OR trigger fine-tune if this many days since last train.
  auto_train_min_examples: 20  # Minimum new examples for the time-based trigger.
                               # Prevents training on tiny batches.
  auto_rollback_expectancy_drop: 0.20  # Rollback new model if expectancy drops >20%.
                                       # Champion-challenger comparison on holdout set.
  auto_rollback_winrate_drop: 0.10     # Rollback if win rate drops >10%.


# ─── DATA ENRICHMENT ───────────────────────────────────────────────────
# Adds fundamental, insider, news, and macro data to trade packets.
# Runs during each scan cycle. Enrichment data feeds into both the
# ranker features and LLM prompt context.
# ⚠️  API keys in .env as FINNHUB_API_KEY and FRED_API_KEY.
# ────────────────────────────────────────────────────────────────────────

data_enrichment:
  enabled: true
  finnhub_api_key: "your-finnhub-api-key"  # → .env: FINNHUB_API_KEY
                                           # Finnhub plan toggle lives below.
  finnhub_plan: "auto"                     # one of: auto, free, fundamental-1
                                           # Also overridable via FINNHUB_PLAN in .env.
                                           # `free` disables premium-only enrichments.
                                           # `fundamental-1` enables the paid features
                                           # currently wired in code (e.g. news sentiment).
  fred_api_key: "your-fred-api-key"        # → .env: FRED_API_KEY
                                           # Free. Get at fred.stlouisfed.org/docs/api.
  cache_hours: 24              # How long to cache enrichment data before re-fetching.
                               # 24 = fetch fresh data once per day.
                               # 6 = more responsive to intraday changes.
  insider_lookback_days: 90    # Days of insider transaction history to include.
  include_news_in_backfill: true  # Include Finnhub news headlines in historical backfill.


# ─── RISK GOVERNOR ──────────────────────────────────────────────────────
# Circuit breakers that override all other logic. These are HARD limits
# — if any check fails, the trade is rejected regardless of score or
# LLM conviction.
# ────────────────────────────────────────────────────────────────────────

risk_governor:
  enabled: true                # false = disable all risk checks (DANGEROUS — never do this in live).
  max_daily_loss_pct: 0.03     # HALT all trading if portfolio drops 3% in one day.
                               # Uses realized P&L only (not unrealized).
  max_position_pct: 0.10       # No single position can exceed 10% of portfolio equity.
  max_open_positions: 10       # Maximum simultaneous open positions.
                               # Overridden by bootcamp.max_positions when bootcamp enabled.
  max_sector_pct: 0.30         # No single sector can exceed 30% of portfolio.
                               # Prevents concentration risk (e.g., all tech).
  max_correlated: 3            # Max positions in the same GICS sector.
  vol_halt_pct: 35.0           # Halt new longs if VIX proxy exceeds this level.
                               # 35 = only during significant market stress.
  kill_switch_file: data/trading_halted  # If this file exists, ALL trading halts immediately.
                                         # Create it: touch data/trading_halted
                                         # Remove it: rm data/trading_halted


# ─── EVENT RISK ─────────────────────────────────────────────────────────
# Continuous 0-10 scoring for earnings, FOMC, CPI, and other events.
# Affects position sizing (multiplier) and can hard-block new trades.
# ────────────────────────────────────────────────────────────────────────

event_risk:
  enabled: true
  block_threshold: 8           # Score ≥8 = hard block. No new positions opened.
                               # Typical trigger: earnings within 1-2 days.
  alert_threshold: 6           # Score ≥6 = Telegram alert, but trade still allowed.
  sizing_floor: 0.25           # Minimum sizing multiplier from event risk.
                               # 0.25 = position size reduced to 25% max.


# ─── REGIME ADAPTIVE ───────────────────────────────────────────────────
# When enabled, the ranker qualification threshold automatically adjusts
# based on market regime (VIX level + trend direction).
#
# Regime thresholds (packet_worthy score required):
#   BULL_LOW_VOL:     40   (easiest — most trades)
#   BULL_HIGH_VOL:    50
#   TRANSITION:       60
#   CORRECTION:       65
#   BEAR_EARLY:       75
#   BEAR_ESTABLISHED: 80
#   CRISIS:           90   (hardest — very few trades)
# ────────────────────────────────────────────────────────────────────────

regime_adaptive:
  enabled: true                # false = use static qualification_threshold from bootcamp/ranking.


# ─── BOOTCAMP (Phase 1 Data Collection) ────────────────────────────────
# High-volume mode for the initial data collection phase. Lowers
# qualification thresholds and raises position limits to generate as
# many training examples as possible across all market conditions.
#
# ⚠️  When enabled, overrides risk.max_open_positions and
#     ranking.packet_worthy_threshold with the values below.
# ────────────────────────────────────────────────────────────────────────

bootcamp:
  enabled: false               # true = Phase 1 data collection mode.
  phase: 1                     # 1 = data collection (current)
                               # 2 = optimization (after 50-trade gate)
                               # 3 = ML/LLM learning (after 100-trade gate)
  qualification_threshold: 40  # Ranker score needed to open a trade.
                               # Normal (non-bootcamp): 70.
                               # Lower = more trades = more training data.
  watchlist_threshold: 25      # Ranker score to appear on watchlist.
                               # Normal: 45. Lower = broader monitoring.
  max_positions: 50            # Effectively unlimited during bootcamp.
                               # The goal is volume, not risk management.
  traffic_light_floor: 0.5     # Minimum Traffic Light sizing multiplier.
                               # Normal RED regime = 0.1x (barely trades).
                               # Bootcamp = 0.5x (still trades in volatility).
                               # The data from volatile regimes is MORE valuable.
  email_mode: full_stream      # "full_stream" — email every packet immediately.
                               # "daily_summary" — one email at EOD.
                               # "digest" — multiple digests per day (see email.digest_times).
                               # "silent" — no emails, Telegram only.
  max_packets_per_scan: 8      # Cap packets per scan cycle. Prevents 20+ trades in one scan.
  scan_interval_minutes: 30    # How often to scan during market hours.
                               # Must fit LLM inference time (8 packets × ~30s = 4 min).


# ─── LOGGING ────────────────────────────────────────────────────────────

logging:
  level: INFO                  # DEBUG, INFO, WARNING, ERROR, CRITICAL.
                               # DEBUG = very verbose (every function call).
                               # INFO = recommended for production.
  file: logs/arcis.log         # Log file path. Auto-rotated: 10MB × 7 files.


# ─── TELEGRAM ───────────────────────────────────────────────────────────
# Real-time push alerts: trade opens/closes, earnings warnings, council
# results, overnight collection, system errors. 32 supported commands.
#
# SETUP:
#   1. Message @BotFather on Telegram → /newbot → copy the token
#   2. Message your new bot → /start
#   3. Get your chat_id from: https://api.telegram.org/bot<TOKEN>/getUpdates
#   4. Put token + chat_id in .env (not here)
#
# ⚠️  Secrets in .env as TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
# ────────────────────────────────────────────────────────────────────────

telegram:
  enabled: false               # true = send Telegram notifications.
  bot_token: "your-bot-token-from-botfather"   # → .env: TELEGRAM_BOT_TOKEN
  chat_id: "your-chat-id"                      # → .env: TELEGRAM_CHAT_ID


# ─── RENDER (Cloud Dashboard) ──────────────────────────────────────────
# Syncs local SQLite data to Render Postgres every N seconds.
# The React dashboard at halcyonlab.app reads from Postgres.
# ⚠️  Connection string in .env as DATABASE_URL.
# ────────────────────────────────────────────────────────────────────────

render:
  enabled: false               # true = sync local data to Render Postgres.
  database_url: "postgresql://user:pass@host:5432/halcyon"  # → .env: DATABASE_URL
  sync_interval_seconds: 120   # How often to push data to Render.
                               # 120 = every 2 minutes. Dashboard is near-real-time.
                               # 300 = every 5 minutes. Lower bandwidth.


# ─── AI COUNCIL ─────────────────────────────────────────────────────────
# 5-agent Modified Delphi deliberation system. Runs daily (or weekly)
# to produce a market consensus (BULLISH/NEUTRAL/BEARISH).
# Agents: tactical_operator, strategic_architect, red_team,
#         innovation_engine, macro_navigator.
# Cost: ~$0.14 per session via Claude Sonnet API.
# ────────────────────────────────────────────────────────────────────────

council:
  enabled: true
  daily_hour_et: 8             # Run daily session at this hour (ET).
  daily_minute_et: 30          # Run daily session at this minute.
                               # 8:30 AM = before market open, after pre-market data.
  rounds: 3                    # Max deliberation rounds per session.
                               # Round 1: independent votes.
                               # Round 2: shared context, revised votes (if contested).
                               # Round 3: final vote (rarely needed).
  temperature: 0.8             # Agent creativity. Higher = more diverse opinions.
  max_session_cost: 2.00       # Cost cap in dollars. Skips Round 2 if exceeding.
  auto_apply_parameters: false # FINSABER guardrail (Phase 1): when false, the
                               # council's parameter recommendations are logged
                               # for counterfactual analysis but NOT applied to
                               # live config. Defaults remain in force. Flip to
                               # true only once the council has demonstrated
                               # positive attributed value (Phase 2).


# ─── EXECUTION ──────────────────────────────────────────────────────────
# Controls how bracket orders are placed on Alpaca.
# A bracket order = entry + stop-loss + take-profit as one atomic order.
# All bracket orders use GTC (Good-Til-Canceled) time-in-force.
# ────────────────────────────────────────────────────────────────────────

execution:
  order_type: limit            # "market" — fill immediately at best available price.
                               # "limit" — place limit order at entry_zone price.
                               #   Better fills but may not execute if price moves away.
  limit_timeout_seconds: 300   # Cancel unfilled limit orders after 5 minutes.
                               # Only applies when order_type is "limit".

# ════════════════════════════════════════════════════════════════════════════
# STRATEGIES — Multi-strategy configuration
# ════════════════════════════════════════════════════════════════════════════

strategies:
  pullback:
    enabled: true              # Strategy #1 — pullback-in-uptrend (default, always on)
    timeout_days: 8            # Auto-close pullback trades after N days.
                               # Research (Scaling Levers): 90%+ of pullback alpha captured
                               # in 3-7 days. Original 15-day timeout was too generous.
                               # Capital velocity scales Sharpe by sqrt(N) — shorter holds
                               # = more trades/year = higher annualized Sharpe.
    target_hold_days: 5        # Optimal target for pullback hold period.
                               # Used for analytics/reporting, not execution.
                               # If median actual hold > 7 days at 50 trades, investigate.
    stop_atr_multiplier: 2.0   # ATR multiplier for stop-loss distance.
    target_atr_multiplier: 2.0 # ATR multiplier for take-profit target.

  mean_reversion:
    enabled: true              # Strategy #2 — Connors RSI(2) mean reversion
    paper_only: true           # NEVER live until Phase 2 gate — enforced in executor
    rsi_period: 2              # Connors RSI lookback
    rsi_entry_threshold: 10    # RSI(2) < 10 = extreme oversold entry
    rsi_exit_threshold: 70     # RSI(2) > 70 = mean reversion target exit
    require_above_200ema: true # Quality filter — only trade above 200-day EMA
    max_positions: 5           # Max simultaneous MR positions
    holding_period: 5          # Max days to hold (timeout exit)
    stop_atr_multiple: 2.5    # Stop loss at entry - 2.5x ATR

# ════════════════════════════════════════════════════════════════════════════
# OBSERVABILITY — Centralized log aggregation
# ════════════════════════════════════════════════════════════════════════════

observability:
  grafana:
    enabled: false                              # Flip true in settings.local.yaml after configuring credentials
    loki_url: "https://logs-prod-042.grafana.net/loki/api/v1/push"
    loki_user: "1553293"                        # Grafana Cloud user ID
    # Token goes in .env as GRAFANA_LOKI_TOKEN (write scope)


# ─── DESKS ──────────────────────────────────────────────────────────────
# Per-desk Alpaca paper account routing. Each named desk maps to a pair of
# env vars that supply the Alpaca API key + secret for that desk's paper
# account. Task 7a (Sprint 4) reads these to build per-desk TradingClients.
#
# ⚠️  Keys must be in .env (not here):
#   Swing desk:    ALPACA_API_KEY / ALPACA_API_SECRET
#   Research desk: ALPACA_RESEARCH_API_KEY / ALPACA_RESEARCH_API_SECRET
#
# research.enabled defaults to false — operator flips to true after
# creating a second Alpaca paper account for the research desk and
# exporting the two ALPACA_RESEARCH_* env vars.
# ────────────────────────────────────────────────────────────────────────

desks:
  swing:
    alpaca_key_env: ALPACA_API_KEY
    alpaca_secret_env: ALPACA_API_SECRET
    enabled: true
  research:
    alpaca_key_env: ALPACA_RESEARCH_API_KEY
    alpaca_secret_env: ALPACA_RESEARCH_API_SECRET
    enabled: false  # operator flips to true after setting up research account
