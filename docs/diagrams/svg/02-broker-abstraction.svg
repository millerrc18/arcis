<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
<style>
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}.arr{stroke:#5F5E5A;stroke-width:1.5}
.c-blue rect{fill:#E3F0FA;stroke:#1565A6;stroke-width:0.5}.c-blue .th{fill:#0D4A7A}.c-blue .ts{fill:#1565A6}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EDE7F5;stroke:#5E35A8;stroke-width:0.5}.c-purple .th{fill:#3E1F78}.c-purple .ts{fill:#5E35A8}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-amber rect{fill:#FDF4E0;stroke:#A67A0B;stroke-width:0.5}.c-amber .th{fill:#7A5908}.c-amber .ts{fill:#A67A0B}
.c-pink rect{fill:#FCE4EC;stroke:#AD1457;stroke-width:0.5}.c-pink .th{fill:#880E4F}.c-pink .ts{fill:#AD1457}
.c-red rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.5}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media(prefers-color-scheme:dark){.th{fill:#D3D1C7}.ts{fill:#888780}.arr{stroke:#888780}.c-blue rect{fill:#0D4A7A;stroke:#5BA3D9}.c-blue .th{fill:#A3D1F0}.c-blue .ts{fill:#5BA3D9}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-purple rect{fill:#3E1F78;stroke:#A07FD4}.c-purple .th{fill:#C9B5E8}.c-purple .ts{fill:#A07FD4}.c-coral rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}.c-amber rect{fill:#7A5908;stroke:#D4A843}.c-amber .th{fill:#F0D68A}.c-amber .ts{fill:#D4A843}.c-pink rect{fill:#880E4F;stroke:#F48FB1}.c-pink .th{fill:#F8BBD0}.c-pink .ts{fill:#F48FB1}.c-red rect{fill:#791F1F;stroke:#F09595}.c-red .th{fill:#F7C1C1}.c-red .ts{fill:#F09595}.c-green rect{fill:#27500A;stroke:#97C459}.c-green .th{fill:#C0DD97}.c-green .ts{fill:#97C459}.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Title -->
<text x="340" y="22" class="th" text-anchor="middle" font-size="15" font-weight="600">Broker Abstraction Layer — Multi-Broker Architecture</text>

<!-- Top: Executor (centered) -->
<g class="c-purple" transform="translate(240,44)">
  <rect width="200" height="44" rx="5"/>
  <text x="100" y="24" class="th" text-anchor="middle">Executor</text>
  <text x="100" y="40" class="ts" text-anchor="middle">orchestrates order routing</text>
</g>

<!-- Branch lines from Executor bottom-center -->
<!-- Left branch line: 340 -> 160 -->
<line x1="340" y1="88" x2="340" y2="104" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="160" y1="104" x2="480" y2="104" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="160" y1="104" x2="160" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="104" x2="480" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Left branch label -->
<text x="160" y="120" class="ts" text-anchor="middle">Paper Trades</text>

<!-- Right branch label -->
<text x="480" y="120" class="ts" text-anchor="middle">Live Trades</text>

<!-- Left: alpaca_adapter.py (y=130) -->
<g class="c-amber" transform="translate(70,130)">
  <rect width="180" height="44" rx="5"/>
  <text x="90" y="24" class="th" text-anchor="middle">alpaca_adapter.py</text>
  <text x="90" y="40" class="ts" text-anchor="middle">Direct call</text>
</g>
<text x="160" y="190" class="ts" text-anchor="middle" font-size="11">No abstraction layer</text>

<!-- Arrow left: alpaca_adapter -> Alpaca Paper API -->
<line x1="160" y1="174" x2="160" y2="214" class="arr" marker-end="url(#arrow)" stroke="#5F5E5A"/>

<!-- Left bottom: Alpaca Paper API -->
<g class="c-gray" transform="translate(80,220)">
  <rect width="160" height="44" rx="5"/>
  <text x="80" y="24" class="th" text-anchor="middle">Alpaca Paper API</text>
  <text x="80" y="40" class="ts" text-anchor="middle">paper-api.alpaca.markets</text>
</g>

<!-- Right: BrokerFactory (y=130) -->
<g class="c-teal" transform="translate(390,130)">
  <rect width="180" height="44" rx="5"/>
  <text x="90" y="24" class="th" text-anchor="middle">BrokerFactory</text>
  <text x="90" y="40" class="ts" text-anchor="middle">get_broker(config)</text>
</g>

<!-- Arrow right: BrokerFactory -> BrokerAdapter ABC -->
<line x1="480" y1="174" x2="480" y2="214" class="arr" marker-end="url(#arrow)" stroke="#5F5E5A"/>

<!-- BrokerAdapter ABC (dashed) -->
<g class="c-gray" transform="translate(380,220)">
  <rect width="200" height="50" rx="5" stroke-dasharray="6 3"/>
  <text x="100" y="24" class="th" text-anchor="middle">BrokerAdapter ABC</text>
  <text x="100" y="40" class="ts" text-anchor="middle">place_order · cancel · get_pos</text>
</g>

<!-- Branch lines from BrokerAdapter -->
<line x1="480" y1="270" x2="480" y2="286" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="410" y1="286" x2="550" y2="286" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="410" y1="286" x2="410" y2="304" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="286" x2="550" y2="304" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- AlpacaLiveBroker -->
<g class="c-amber" transform="translate(330,310)">
  <rect width="160" height="44" rx="5"/>
  <text x="80" y="24" class="th" text-anchor="middle">AlpacaLiveBroker</text>
  <text x="80" y="40" class="ts" text-anchor="middle">implements ABC</text>
</g>

<!-- IBBroker (planned, dashed) -->
<g class="c-green" transform="translate(500,310)">
  <rect width="160" height="44" rx="5" stroke-dasharray="6 3"/>
  <text x="80" y="24" class="th" text-anchor="middle">IBBroker</text>
  <text x="80" y="40" class="ts" text-anchor="middle">planned</text>
</g>

<!-- Arrows to bottom APIs -->
<line x1="410" y1="354" x2="410" y2="384" class="arr" marker-end="url(#arrow)" stroke="#5F5E5A"/>
<line x1="580" y1="354" x2="580" y2="384" class="arr" marker-end="url(#arrow)" stroke="#5F5E5A"/>

<!-- Alpaca Live API -->
<g class="c-gray" transform="translate(330,390)">
  <rect width="160" height="40" rx="5"/>
  <text x="80" y="17" class="th" text-anchor="middle">Alpaca Live API</text>
  <text x="80" y="33" class="ts" text-anchor="middle">api.alpaca.markets</text>
</g>

<!-- IB Gateway (dashed) -->
<g class="c-gray" transform="translate(500,390)">
  <rect width="160" height="40" rx="5" stroke-dasharray="6 3"/>
  <text x="80" y="17" class="th" text-anchor="middle">IB Gateway</text>
  <text x="80" y="33" class="ts" text-anchor="middle">:4001 · planned</text>
</g>

</svg>
