<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<style>
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}.arr{stroke:#5F5E5A;stroke-width:1.5}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media(prefers-color-scheme:dark){.th{fill:#D3D1C7}.ts{fill:#888780}.arr{stroke:#888780}.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-coral rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="28" text-anchor="middle">AI Council — 5-agent Modified Delphi protocol</text>
<g class="c-purple"><rect x="40" y="50" width="110" height="56" rx="8"/><text class="th" x="100" y="70" text-anchor="middle" dominant-baseline="central">Tactical</text><text class="ts" x="100" y="88" text-anchor="middle" dominant-baseline="central">Short-term ops</text></g>
<g class="c-teal"><rect x="162" y="50" width="110" height="56" rx="8"/><text class="th" x="217" y="70" text-anchor="middle" dominant-baseline="central">Strategic</text><text class="ts" x="217" y="88" text-anchor="middle" dominant-baseline="central">Long-term plan</text></g>
<g class="c-coral"><rect x="284" y="50" width="110" height="56" rx="8"/><text class="th" x="339" y="70" text-anchor="middle" dominant-baseline="central">Red team</text><text class="ts" x="339" y="88" text-anchor="middle" dominant-baseline="central">Devil's advocate</text></g>
<g class="c-amber"><rect x="406" y="50" width="110" height="56" rx="8"/><text class="th" x="461" y="70" text-anchor="middle" dominant-baseline="central">Innovation</text><text class="ts" x="461" y="88" text-anchor="middle" dominant-baseline="central">New approaches</text></g>
<g class="c-gray"><rect x="528" y="50" width="110" height="56" rx="8"/><text class="th" x="583" y="70" text-anchor="middle" dominant-baseline="central">Macro</text><text class="ts" x="583" y="88" text-anchor="middle" dominant-baseline="central">Market regime</text></g>
<text class="ts" x="340" y="128" text-anchor="middle">Round 1: Independent votes (blind)</text>
<line x1="340" y1="136" x2="340" y2="160" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="160" y="160" width="360" height="44" rx="8"/><text class="th" x="340" y="182" text-anchor="middle" dominant-baseline="central">Round 2: Debate (if no consensus)</text></g>
<line x1="340" y1="204" x2="340" y2="232" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="160" y="232" width="360" height="44" rx="8"/><text class="th" x="340" y="254" text-anchor="middle" dominant-baseline="central">Round 3: Final positions + confidence</text></g>
<line x1="340" y1="276" x2="340" y2="304" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="160" y="304" width="360" height="44" rx="8"/><text class="th" x="340" y="326" text-anchor="middle" dominant-baseline="central">Consensus: direction + confidence → traffic light</text></g>
<text class="ts" x="340" y="358" text-anchor="middle">Output: traffic light regime (green/yellow/red) | Cost: ~$0.50/session | Daily 8:30 AM</text>
</svg>
