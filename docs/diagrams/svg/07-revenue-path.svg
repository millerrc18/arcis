<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<style>
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}.arr{stroke:#5F5E5A;stroke-width:1.5}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.5}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
@media(prefers-color-scheme:dark){.th{fill:#D3D1C7}.ts{fill:#888780}.arr{stroke:#888780}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-green rect{fill:#27500A;stroke:#97C459}.c-green .th{fill:#C0DD97}.c-green .ts{fill:#97C459}.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="28" text-anchor="middle">Revenue sequencing — from trading returns to fund</text>
<g class="c-teal"><rect x="40" y="52" width="140" height="56" rx="8"/><text class="th" x="110" y="72" text-anchor="middle" dominant-baseline="central">Trading returns</text><text class="ts" x="110" y="90" text-anchor="middle" dominant-baseline="central">$1K → $5K live</text></g>
<line x1="180" y1="80" x2="215" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="215" y="52" width="140" height="56" rx="8"/><text class="th" x="285" y="72" text-anchor="middle" dominant-baseline="central">Collective2</text><text class="ts" x="285" y="90" text-anchor="middle" dominant-baseline="central">Verified track record</text></g>
<line x1="355" y1="80" x2="390" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="390" y="52" width="140" height="56" rx="8"/><text class="th" x="460" y="72" text-anchor="middle" dominant-baseline="central">Signals (C2/Darwinex)</text><text class="ts" x="460" y="90" text-anchor="middle" dominant-baseline="central">Parallel revenue stream</text></g>
<line x1="530" y1="80" x2="560" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="560" y="52" width="90" height="56" rx="8"/><text class="th" x="605" y="72" text-anchor="middle" dominant-baseline="central">Fund</text><text class="ts" x="605" y="90" text-anchor="middle" dominant-baseline="central">LP structure</text></g>
<text class="ts" x="110" y="130" text-anchor="middle">Year 1</text>
<text class="ts" x="285" y="130" text-anchor="middle">Month 3+</text>
<text class="ts" x="460" y="130" text-anchor="middle">Year 1-2</text>
<text class="ts" x="605" y="130" text-anchor="middle">Year 3+</text>
<text class="th" x="340" y="168" text-anchor="middle">Fund economics</text>
<g class="c-purple"><rect x="40" y="184" width="185" height="56" rx="8"/><text class="th" x="132" y="204" text-anchor="middle" dominant-baseline="central">1.5% management fee</text><text class="ts" x="132" y="222" text-anchor="middle" dominant-baseline="central">Covers $100-150K ops</text></g>
<g class="c-purple"><rect x="245" y="184" width="185" height="56" rx="8"/><text class="th" x="337" y="204" text-anchor="middle" dominant-baseline="central">17.5% performance fee</text><text class="ts" x="337" y="222" text-anchor="middle" dominant-baseline="central">Above HWM + SOFR hurdle</text></g>
<g class="c-purple"><rect x="450" y="184" width="185" height="56" rx="8"/><text class="th" x="542" y="204" text-anchor="middle" dominant-baseline="central">Break-even ~$7-10M AUM</text><text class="ts" x="542" y="222" text-anchor="middle" dominant-baseline="central">Scalable to $500M+</text></g>
<text class="ts" x="340" y="270" text-anchor="middle">S&P 100 universe: $500M-$24B daily volume per name = zero capacity constraint through $500M AUM</text>
<text class="ts" x="340" y="290" text-anchor="middle">Alpha leakage from signal publication: effectively zero for mega-cap equities</text>
</svg>
