<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<style>
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media(prefers-color-scheme:dark){.th{fill:#D3D1C7}.ts{fill:#888780}.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#B5D4F4}.c-blue .ts{fill:#85B7EB}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}.c-coral rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}}
</style>
<text class="th" x="340" y="28" text-anchor="middle">Watch loop — 24-hour daily cycle</text>
<g class="c-purple"><rect x="40" y="48" width="280" height="44" rx="8"/><text class="th" x="180" y="62" text-anchor="middle" dominant-baseline="central">6:00 AM — Pre-market inference</text><text class="ts" x="180" y="80" text-anchor="middle" dominant-baseline="central">Ollama warm-up, VRAM handoff from training</text></g>
<g class="c-amber"><rect x="360" y="48" width="280" height="44" rx="8"/><text class="th" x="500" y="62" text-anchor="middle" dominant-baseline="central">7:30 AM — Fundamentals refresh</text><text class="ts" x="500" y="80" text-anchor="middle" dominant-baseline="central">Earnings, SEC, macro data (Tier 4)</text></g>
<g class="c-teal"><rect x="40" y="106" width="280" height="44" rx="8"/><text class="th" x="180" y="120" text-anchor="middle" dominant-baseline="central">8:00 AM — Morning watchlist</text><text class="ts" x="180" y="138" text-anchor="middle" dominant-baseline="central">Top pullback candidates, email digest</text></g>
<g class="c-blue"><rect x="360" y="106" width="280" height="44" rx="8"/><text class="th" x="500" y="120" text-anchor="middle" dominant-baseline="central">8:30 AM — AI Council session</text><text class="ts" x="500" y="138" text-anchor="middle" dominant-baseline="central">5 agents, 3 rounds, set traffic light</text></g>
<g class="c-teal"><rect x="40" y="166" width="600" height="56" rx="10"/><text class="th" x="340" y="186" text-anchor="middle" dominant-baseline="central">9:30 AM – 4:00 PM — Market hours</text><text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">Scans 30min / Positions 15min / Sentiment 60min / Heartbeat</text></g>
<g class="c-coral"><rect x="40" y="238" width="280" height="44" rx="8"/><text class="th" x="180" y="252" text-anchor="middle" dominant-baseline="central">4:00 PM — EOD recap</text><text class="ts" x="180" y="270" text-anchor="middle" dominant-baseline="central">P&L summary, Telegram report, metrics</text></g>
<g class="c-amber"><rect x="360" y="238" width="280" height="44" rx="8"/><text class="th" x="500" y="252" text-anchor="middle" dominant-baseline="central">4:30 PM — Post-close jobs</text><text class="ts" x="500" y="270" text-anchor="middle" dominant-baseline="central">Attribution resolve, build score, audit</text></g>
<g class="c-purple"><rect x="40" y="296" width="600" height="56" rx="10"/><text class="th" x="340" y="316" text-anchor="middle" dominant-baseline="central">6:50 PM – 5:15 AM — Overnight</text><text class="ts" x="340" y="334" text-anchor="middle" dominant-baseline="central">12 collectors / Training data gen / Saturday retrain / GPU 50-70%</text></g>
<g class="c-gray"><rect x="40" y="366" width="600" height="44" rx="8"/><text class="th" x="340" y="380" text-anchor="middle" dominant-baseline="central">Sunday 9:00 PM — Stress test (3 scenarios)</text><text class="ts" x="340" y="398" text-anchor="middle" dominant-baseline="central">2008 GFC + 2020 COVID + 2022 Bear | Re-run on model version change</text></g>
</svg>
