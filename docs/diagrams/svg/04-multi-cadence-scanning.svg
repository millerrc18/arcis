<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<style>
.th{font-family:var(--font-sans,"Anthropic Sans",system-ui,sans-serif);font-size:14px;font-weight:500;fill:var(--p,#2C2C2A)}.ts{font-family:var(--font-sans,"Anthropic Sans",system-ui,sans-serif);font-size:12px;fill:var(--s,#5F5E5A)}.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}.c-blue rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media(prefers-color-scheme:dark){.th{fill:#D3D1C7}.ts{fill:#888780}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#B5D4F4}.c-blue .ts{fill:#85B7EB}.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}}
</style>
<text class="th" x="340" y="28" text-anchor="middle">Multi-cadence scanning — 4-tier architecture</text>
<g class="c-teal"><rect x="40" y="50" width="600" height="56" rx="8"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">Tier 1: Position monitor (every 15 min)</text><text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central">Stop/target proximity, MR RSI exits, intra-day reconciliation</text></g>
<g class="c-blue"><rect x="40" y="120" width="600" height="56" rx="8"/><text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Tier 2: Universe scan (every 30 min)</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">Full pipeline — OHLCV fetch, features, rank, LLM, execute</text></g>
<g class="c-amber"><rect x="40" y="190" width="600" height="56" rx="8"/><text class="th" x="340" y="210" text-anchor="middle" dominant-baseline="central">Tier 3: Sentiment refresh (every 60 min)</text><text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">VIX regime, news sentiment, sector rotation signals</text></g>
<g class="c-purple"><rect x="40" y="260" width="600" height="56" rx="8"/><text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">Tier 4: Fundamentals refresh (daily at 7:30 AM)</text><text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central">Earnings calendar, SEC filings, insider transactions, macro data</text></g>
</svg>
