<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<style>
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}.arr{stroke:#5F5E5A;stroke-width:1.5}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.5}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
@media(prefers-color-scheme:dark){.th{fill:#D3D1C7}.ts{fill:#888780}.arr{stroke:#888780}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}.c-green rect{fill:#27500A;stroke:#97C459}.c-green .th{fill:#C0DD97}.c-green .ts{fill:#97C459}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="28" text-anchor="middle">Hardware scaling path</text>
<g class="c-teal"><rect x="40" y="50" width="180" height="80" rx="10"/><text class="th" x="130" y="72" text-anchor="middle" dominant-baseline="central">Phase 1 (now)</text><text class="ts" x="130" y="92" text-anchor="middle" dominant-baseline="central">RTX 3060 12GB</text><text class="ts" x="130" y="108" text-anchor="middle" dominant-baseline="central">Qwen3 8B (Q8_0)</text><text class="ts" x="130" y="124" text-anchor="middle" dominant-baseline="central">Windows 11</text></g>
<line x1="220" y1="90" x2="260" y2="90" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="260" y="50" width="180" height="80" rx="10"/><text class="th" x="350" y="72" text-anchor="middle" dominant-baseline="central">Phase 2 (~$1,300)</text><text class="ts" x="350" y="92" text-anchor="middle" dominant-baseline="central">RTX 3090 24GB</text><text class="ts" x="350" y="108" text-anchor="middle" dominant-baseline="central">14B model + GRPO</text><text class="ts" x="350" y="124" text-anchor="middle" dominant-baseline="central">Ubuntu headless</text></g>
<line x1="440" y1="90" x2="480" y2="90" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="480" y="50" width="160" height="80" rx="10"/><text class="th" x="560" y="72" text-anchor="middle" dominant-baseline="central">Phase 3+</text><text class="ts" x="560" y="92" text-anchor="middle" dominant-baseline="central">Multi-LoRA adapters</text><text class="ts" x="560" y="108" text-anchor="middle" dominant-baseline="central">Strategy-specific 14B</text><text class="ts" x="560" y="124" text-anchor="middle" dominant-baseline="central">PostgreSQL primary</text></g>
<text class="th" x="340" y="168" text-anchor="middle">Phase 2 eliminates</text>
<g class="c-amber"><rect x="40" y="184" width="140" height="36" rx="6"/><text class="ts" x="110" y="204" text-anchor="middle" dominant-baseline="central">OneDrive corruption</text></g>
<g class="c-amber"><rect x="196" y="184" width="140" height="36" rx="6"/><text class="ts" x="266" y="204" text-anchor="middle" dominant-baseline="central">SQLite concurrency</text></g>
<g class="c-amber"><rect x="352" y="184" width="140" height="36" rx="6"/><text class="ts" x="422" y="204" text-anchor="middle" dominant-baseline="central">Power loss risk</text></g>
<g class="c-amber"><rect x="508" y="184" width="140" height="36" rx="6"/><text class="ts" x="578" y="204" text-anchor="middle" dominant-baseline="central">Windows sleep</text></g>
<g class="c-amber"><rect x="120" y="230" width="200" height="36" rx="6"/><text class="ts" x="220" y="250" text-anchor="middle" dominant-baseline="central">GPU contention / VRAM handoff</text></g>
<g class="c-amber"><rect x="360" y="230" width="200" height="36" rx="6"/><text class="ts" x="460" y="250" text-anchor="middle" dominant-baseline="central">12GB model size ceiling</text></g>
<text class="ts" x="340" y="286" text-anchor="middle">Trigger: Phase 1 gate passed OR database corruption recurrence</text>
</svg>
