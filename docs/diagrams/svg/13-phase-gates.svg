<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
<style>
.th{font-family:system-ui,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:system-ui,sans-serif;font-size:12px;fill:#5F5E5A}.arr{stroke:#5F5E5A;stroke-width:1.5}
.c-blue rect{fill:#E3F0FA;stroke:#1565A6;stroke-width:0.5}.c-blue .th{fill:#0D4A7A}.c-blue .ts{fill:#1565A6}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple rect{fill:#EDE7F5;stroke:#5E35A8;stroke-width:0.5}.c-purple .th{fill:#3E1F78}.c-purple .ts{fill:#5E35A8}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-amber rect{fill:#FDF4E0;stroke:#A67A0B;stroke-width:0.5}.c-amber .th{fill:#7A5908}.c-amber .ts{fill:#A67A0B}
.c-pink rect{fill:#FCE4EC;stroke:#AD1457;stroke-width:0.5}.c-pink .th{fill:#880E4F}.c-pink .ts{fill:#AD1457}
.c-red rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.5}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
@media(prefers-color-scheme:dark){.th{fill:#D3D1C7}.ts{fill:#888780}.arr{stroke:#888780}.c-blue rect{fill:#0D4A7A;stroke:#5BA3D9}.c-blue .th{fill:#A3D1F0}.c-blue .ts{fill:#5BA3D9}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-purple rect{fill:#3E1F78;stroke:#A07FD4}.c-purple .th{fill:#C9B5E8}.c-purple .ts{fill:#A07FD4}.c-coral rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}.c-amber rect{fill:#7A5908;stroke:#D4A843}.c-amber .th{fill:#F0D68A}.c-amber .ts{fill:#D4A843}.c-pink rect{fill:#880E4F;stroke:#F48FB1}.c-pink .th{fill:#F8BBD0}.c-pink .ts{fill:#F48FB1}.c-red rect{fill:#791F1F;stroke:#F09595}.c-red .th{fill:#F7C1C1}.c-red .ts{fill:#F09595}.c-green rect{fill:#27500A;stroke:#97C459}.c-green .th{fill:#C0DD97}.c-green .ts{fill:#97C459}.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Title -->
<text x="340" y="26" class="th" font-size="16" font-weight="600" text-anchor="middle">Phase Gates — Bootcamp to Fund Formation</text>

<!-- Row 1 (y=48): Phase 1 → Gate → Phase 2 -->
<!-- Phase 1: Bootcamp (c-teal) x=60, y=48, w=180, h=50 -->
<g class="c-teal" transform="translate(60,48)">
  <rect width="180" height="50" rx="6"/>
  <text x="90" y="22" class="th" text-anchor="middle">Phase 1: Bootcamp</text>
  <text x="90" y="38" class="ts" text-anchor="middle">Paper trading, model</text>
  <text x="90" y="50" class="ts" text-anchor="middle">validation</text>
</g>
<!-- Arrow 1 -->
<line x1="240" y1="73" x2="260" y2="73" class="arr" stroke="#5F5E5A" marker-end="url(#arrow)"/>
<!-- Gate 1: 50 trades, WR≥45% (c-amber) x=260, y=48, w=160, h=50 -->
<g class="c-amber" transform="translate(260,48)">
  <rect width="160" height="50" rx="6"/>
  <text x="80" y="22" class="th" text-anchor="middle">Gate 1</text>
  <text x="80" y="38" class="ts" text-anchor="middle">50 trades, WR≥45%</text>
  <text x="80" y="50" class="ts" text-anchor="middle">PF≥1.4, Sharpe≥1.0</text>
</g>
<!-- Arrow 2 -->
<line x1="420" y1="73" x2="440" y2="73" class="arr" stroke="#5F5E5A" marker-end="url(#arrow)"/>
<!-- Phase 2: Scale (c-teal) x=440, y=48, w=180, h=50 -->
<g class="c-teal" transform="translate(440,48)">
  <rect width="180" height="50" rx="6"/>
  <text x="90" y="22" class="th" text-anchor="middle">Phase 2: Scale</text>
  <text x="90" y="38" class="ts" text-anchor="middle">Live capital, position</text>
  <text x="90" y="50" class="ts" text-anchor="middle">sizing growth</text>
</g>

<!-- Arrow down from Phase 2 to Row 2 -->
<line x1="530" y1="98" x2="530" y2="134" class="arr" stroke="#5F5E5A" marker-end="url(#arrow)"/>
<polyline points="530,134 530,148 440,148" fill="none" class="arr" stroke="#5F5E5A" marker-end="url(#arrow)"/>

<!-- Row 2 (y=148): Phase 3-4 → Gate 2 → Fund Formation -->
<!-- Phase 3-4: Multi-Strategy (c-teal) x=60, y=148, w=200, h=50 -->
<g class="c-teal" transform="translate(60,148)">
  <rect width="200" height="50" rx="6"/>
  <text x="100" y="22" class="th" text-anchor="middle">Phase 3–4: Multi-Strategy</text>
  <text x="100" y="38" class="ts" text-anchor="middle">Options, crypto, expanded</text>
  <text x="100" y="50" class="ts" text-anchor="middle">universe</text>
</g>
<!-- Arrow -->
<line x1="260" y1="173" x2="280" y2="173" class="arr" stroke="#5F5E5A" marker-end="url(#arrow)"/>
<!-- Gate 2: 3-month track (c-amber) x=280, y=148, w=160, h=50 -->
<g class="c-amber" transform="translate(280,148)">
  <rect width="160" height="50" rx="6"/>
  <text x="80" y="22" class="th" text-anchor="middle">Gate 2</text>
  <text x="80" y="38" class="ts" text-anchor="middle">3-month live track</text>
  <text x="80" y="50" class="ts" text-anchor="middle">PSR(0)≥90%</text>
</g>
<!-- Arrow -->
<line x1="440" y1="173" x2="460" y2="173" class="arr" stroke="#5F5E5A" marker-end="url(#arrow)"/>
<!-- Fund Formation (c-green) x=460, y=148, w=180, h=50 -->
<g class="c-green" transform="translate(460,148)">
  <rect width="180" height="50" rx="6"/>
  <text x="90" y="22" class="th" text-anchor="middle">Fund Formation</text>
  <text x="90" y="38" class="ts" text-anchor="middle">External capital,</text>
  <text x="90" y="50" class="ts" text-anchor="middle">RIA / partnership</text>
</g>

<!-- Timeline bar (y=248) -->
<!-- Background gray bar -->
<g class="c-gray">
  <rect x="60" y="248" width="560" height="24" rx="4"/>
</g>
<!-- Green fill: 13/50 trades progress. Phase 1 spans ~Apr–Jul 2026 which is roughly the first 280px segment. 13/50 = 26% of Phase 1 window = ~73px -->
<rect x="60" y="248" width="73" height="24" rx="4" fill="#3B6D11" opacity="0.75"/>
<!-- Progress label -->
<text x="146" y="264" class="ts" text-anchor="start" fill="#444441" font-size="11">13/50 trades</text>

<!-- Timeline date labels below bar -->
<text x="60" y="286" class="ts" text-anchor="middle">Apr 2026</text>
<text x="247" y="286" class="ts" text-anchor="middle">Jul 2026</text>
<text x="433" y="286" class="ts" text-anchor="middle">Dec 2026</text>
<text x="620" y="286" class="ts" text-anchor="middle">2027+</text>
<!-- Tick marks -->
<line x1="60" y1="272" x2="60" y2="280" stroke="#5F5E5A" stroke-width="1"/>
<line x1="247" y1="272" x2="247" y2="280" stroke="#5F5E5A" stroke-width="1"/>
<line x1="433" y1="272" x2="433" y2="280" stroke="#5F5E5A" stroke-width="1"/>
<line x1="620" y1="272" x2="620" y2="280" stroke="#5F5E5A" stroke-width="1"/>

<!-- Gate criteria text (y=320) -->
<text x="340" y="314" class="th" text-anchor="middle" font-size="13">Phase 1 Gate Criteria</text>
<text x="340" y="336" class="ts" text-anchor="middle">Win rate ≥45%  •  Profit factor ≥1.4  •  Sharpe ≥1.0</text>
<text x="340" y="356" class="ts" text-anchor="middle">PSR(0) ≥90%  •  Max drawdown &lt;20%</text>
<text x="340" y="376" class="ts" text-anchor="middle">50+ closed trades with bracket orders</text>

<!-- Current phase indicator -->
<text x="340" y="408" class="ts" text-anchor="middle" fill="#0F6E56" font-size="11">Currently active: Phase 1 — Apr 2026</text>

</svg>
