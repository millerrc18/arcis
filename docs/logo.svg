<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Main "A" fortress triangle -->
  <path d="M256 52 L420 400 L92 400 Z" fill="url(#blueGrad)" opacity="0.15"/>
  <path d="M256 52 L420 400 L92 400 Z" stroke="#3B82F6" stroke-width="6" fill="none" stroke-linejoin="round"/>

  <!-- Inner bar chart / fortress battlements -->
  <rect x="175" y="300" width="22" height="80" rx="2" fill="#3B82F6"/>
  <rect x="207" y="260" width="22" height="120" rx="2" fill="#3B82F6"/>
  <rect x="239" y="220" width="22" height="160" rx="2" fill="#3B82F6"/>
  <rect x="271" y="240" width="22" height="140" rx="2" fill="#3B82F6"/>
  <rect x="303" y="280" width="22" height="100" rx="2" fill="#3B82F6"/>

  <!-- Candlestick wicks on top of bars -->
  <line x1="186" y1="280" x2="186" y2="300" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="218" y1="238" x2="218" y2="260" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="195" x2="250" y2="220" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="282" y1="218" x2="282" y2="240" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="314" y1="258" x2="314" y2="280" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Upward arrow (rising from the bars, breaking through the triangle) -->
  <path d="M340 310 L340 120 L310 155" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M340 120 L370 155" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Trend line connecting bar tops -->
  <polyline points="186,290 218,248 250,207 282,228 314,268"
            stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Grid lines (subtle) -->
  <line x1="155" y1="340" x2="345" y2="340" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
  <line x1="165" y1="300" x2="335" y2="300" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>
  <line x1="185" y1="260" x2="325" y2="260" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>

  <!-- ARCIS wordmark -->
  <text x="256" y="460" text-anchor="middle"
        font-family="'Inter', 'SF Pro Display', -apple-system, 'Segoe UI', sans-serif"
        font-size="64" font-weight="800" letter-spacing="8" fill="#3B82F6">
    ARCIS
  </text>
</svg>
