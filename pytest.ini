[pytest]
# PR-E2 T43 green-gate (DD-42 §46): a stale xfail that unexpectedly passes
# (XPASS) becomes a hard FAILURE rather than a silent green. Paired with the
# fired-skip allowlist enforcement in tests/conftest.py (pytest_sessionfinish).
xfail_strict = true
markers =
    slow: marks tests as slow (deselect with `-m "not slow"`); opt-in via `-m slow`
