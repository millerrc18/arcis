[pytest]
# PR-E2 T43 green-gate (DD-42 §46): a stale xfail that unexpectedly passes
# (XPASS) becomes a hard FAILURE rather than a silent green. Paired with the
# fired-skip allowlist enforcement in tests/conftest.py (pytest_sessionfinish).
xfail_strict = true
# pytest-randomly is installed (requirements.txt) for opt-in order-robustness
# proofs, but the full suite runs in DETERMINISTIC default order by default
# (task 128 / T7): enabling randomization fleet-wide surfaces a pre-existing
# latent order-dependence tail (tracked in a follow-up kin) that is out of scope
# for the determinism sprint. To run a randomized proof on a scoped set, override:
#   pytest <paths> -o addopts= --randomly-seed=<N>
addopts = -p no:randomly
markers =
    slow: marks tests as slow (deselect with `-m "not slow"`); opt-in via `-m slow`
